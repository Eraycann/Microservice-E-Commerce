server:
  port: 8081

spring:
  application:
    name: product-service

  # --- VERITABANI ---
  datasource:
    url: jdbc:postgresql://localhost:5432/productdb
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  # --- JPA / HIBERNATE ---
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true

  # --- RABBITMQ ---
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  # --- GÜVENLİK ---
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/ecommerce-realm
          jwk-set-uri: http://localhost:8180/realms/ecommerce-realm/protocol/openid-connect/certs

# --- AWS S3 ---
aws:
  s3:


# --- SERVICE DISCOVERY ---
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

# ✅ ZIPKIN AYARLARI EKLENDİ
management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: "http://localhost:9411/api/v2/spans"

# ✅ LOGLAMA AYARLARI EKLENDİ
logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"