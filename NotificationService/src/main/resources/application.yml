server:
  port: 8084

spring:
  application:
    name: notification-service

  # --- GÜVENLİK ---
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/ecommerce-realm
          jwk-set-uri: http://localhost:8180/realms/ecommerce-realm/protocol/openid-connect/certs

  # --- MONGODB ---
  data:
    mongodb:
      host: localhost
      port: 27017
      database: ecommerce-notification-db
      username: admin
      password: admin
      authentication-database: admin

  # --- RABBITMQ ---
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 2000ms
          max-interval: 10000ms
          max-attempts: 3
          multiplier: 2

  # --- MAIL (SMTP) AYARLARI ---
  mail:
    host: smtp.gmail.com
    port: 587
    username: sivrieraycan@gmail.com
    password: kyeo taru nrle joek
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
    default-encoding: UTF-8

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

# ✅ ZIPKIN AYARLARI EKLENDİ
management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: "http://localhost:9411/api/v2/spans"

# ✅ LOGLAMA AYARLARI EKLENDİ
logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"