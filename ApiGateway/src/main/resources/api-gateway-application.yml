server:
  port: 8080

spring:
  application:
    name: api-gateway

  # 👇👇👇 BURASI EKLENDİ: DOSYA YÜKLEME İZNİ (ÇOK ÖNEMLİ) 👇👇👇
  main:
    web-application-type: reactive # Gateway'in reaktif olduğunu garantiye alalım
  codec:
    max-in-memory-size: 20MB # Varsayılan 256KB'dır, bunu 20MB yaptık ki resimler geçsin
  # 👆👆👆 --------------------------------------------------- 👆👆👆

  # --- 1. REDIS SESSION (Token Kasası) ---
  session:
    store-type: redis
    timeout: 30m
    redis:
      namespace: spring:session

  data:
    redis:
      host: localhost
      port: 6379

  # --- 2. GÜVENLİK ---
  security:
    oauth2:
      # A. LOGIN İŞLEMİ İÇİN (BFF CLIENT)
      client:
        provider:
          keycloak:
            issuer-uri: http://localhost:8180/realms/ecommerce-realm
            user-name-attribute: preferred_username
        registration:
          keycloak:
            provider: keycloak
            client-id: api-gateway-client
            client-secret: 7qH8b8TS5cbkEYtXxjA58ZHMrebsy4LF
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid, profile, email, roles

      # B. TOKEN DOĞRULAMA İÇİN (RESOURCE SERVER)
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8180/realms/ecommerce-realm/protocol/openid-connect/certs

  # --- 3. GATEWAY & ROUTES ---
  cloud:
    gateway:
      # TokenRelay: Cookie'den gelen token'ı mikroservise iletir
      default-filters:
        - TokenRelay

      # ⚠️ DİKKAT: globalcors BURADAN SİLİNDİ (Java Config kullanılıyor)

      # --- ROTA TANIMLARI (HEM /api/... HEM /api/v1/... DESTEKLİ) ---
      routes:
        # 1. PRODUCT SERVICE
        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/api/v1/products/**, /api/products/**, /api/v1/categories/**, /api/categories/**, /api/v1/brands/**, /api/brands/**
          filters:
            - name: CircuitBreaker
              args:
                name: productCircuitBreaker
                fallbackUri: forward:/fallback/product

        # 2. USER SERVICE
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/v1/users/**, /api/users/**
          filters:
            - name: CircuitBreaker
              args:
                name: userCircuitBreaker
                fallbackUri: forward:/fallback/user

        # 3. SEARCH SERVICE
        - id: search-service
          uri: lb://search-service
          predicates:
            - Path=/api/v1/search/**, /api/search/**
          filters:
            - name: CircuitBreaker
              args:
                name: searchCircuitBreaker
                fallbackUri: forward:/fallback/search

        # 4. ORDER & CART SERVICE
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/v1/orders/**, /api/orders/**, /api/v1/cart/**, /api/cart/**
          filters:
            - name: CircuitBreaker
              args:
                name: orderCircuitBreaker
                fallbackUri: forward:/fallback/order

        # 5. PAYMENT SERVICE
        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/api/v1/payments/**, /api/payments/**
          filters:
            - name: CircuitBreaker
              args:
                name: paymentCircuitBreaker
                fallbackUri: forward:/fallback/payment

        # 6. RECOMMENDATION SERVICE (SORUNLU OLAN KISIM ÇÖZÜLDÜ)
        - id: recommendation-service
          uri: lb://recommendation-service
          predicates:
            # Hem v1 hem normal yolu kabul eder
            - Path=/api/v1/recommendations/**, /api/recommendations/**
          filters:
            - name: CircuitBreaker
              args:
                name: recommendationCircuitBreaker
                fallbackUri: forward:/fallback/recommendation

        # 7. NOTIFICATION SERVICE
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/v1/notifications/**, /api/notifications/**
          filters:
            - name: CircuitBreaker
              args:
                name: notificationCircuitBreaker
                fallbackUri: forward:/fallback/notification

        # 8. FEEDBACK SERVICE (API İŞLEMLERİ)
        - id: feedback-service
          uri: lb://feedback-service
          predicates:
            - Path=/api/v1/reviews/**, /api/v1/questions/**, /api/v1/feedbacks/**
          filters:
            - name: CircuitBreaker
              args:
                name: feedbackCircuitBreaker
                fallbackUri: forward:/fallback/feedback

        # 👇👇👇 BURASI EKLENECEK: RESİM YÜKLEME ROTASI 👇👇👇
        # Frontend "/uploads/resim.jpg" isteği attığında buraya düşecek.
        - id: feedback-service-uploads
          uri: lb://feedback-service
          predicates:
            - Path=/uploads/**
        # 👆👆👆 ------------------------------------------ 👆👆👆

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/